<!DOCTYPE html>
<html lang="en">

<head>
	<title>Solar System: Document Object Model:30 Days Of JavaScript</title>
	<!-- CSS -->
	<link rel="stylesheet" href="./css/reset.css"> 
	<link rel="stylesheet" href="./css/layout.css"> 
	<!-- FONT -->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>

<body>
	<header>
		<h1>Calculate the weight of an object on a planet</h1>

	<div id="planet-selector">
		<input type="text" id="mass" placeholder="Mass in Kilogram" />
		<select>
			<option value='none'>--select planet-- </option>
		</select>
		<button>Calculate weight</button>
	</div>
	</header>
	<main>
		<div class="flex-container">
			<div class="flex-item-image">
				<img src='./img/earth.png' class="planet-image" />
			</div>
			<div class="flex-item-description"></div>

		</div>


	</main>





	<script src="./js/main.js"></script>
</body>

</html>
